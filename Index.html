<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incial</title>
    <Style>
        #body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('/img/1.jpg') no-repeat;
            background-size: cover;
            background-position: center;
        }

        .wrapper{
            width: 420px;
            background: transparent;
            color: white;
            border-radius: 10px;
            padding: 30px 40px;

        }

        .wrapper h1{
            font-size: 36px;
            text-align: center;
        }

        .wrapper .input-box{
            position: relative;
            margin: 10px 0;
            width: 100%;
            height: 50px;
            margin: 30px 0;

        }
         .input-box input{
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            border: 2px solid rgb(255 , 255 , 255, .2);
            border-radius: 40px;
            font-size: 16px;
            color: white;
            padding: 20px 45px 20px 20px;
         }
         .input-box input::placeholder{
            color: white;
         }

         .input-box i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
         }

         .wrapper .remember-forgot{
            display: flex;
            justify-content: space-between;
            font-size: 14.5px;
            margin: -15px 0 15px;
         }
         .remember-forgot label input {
            accent-color: white;
            margin-right: 3px;
        
         }

         .remember-forgot a {
            color: white;
            text-decoration: none;

         }
         .wrapper .btn {
            width: 100%;
            height: 45px;
            background: white;
            border: none;
            outline: none;
            border-radius: 40px;
            box-shadow: 0 0 10px rgb(0, 0, 0 .1);
            cursor: pointer;
            font-size: 16px;
            color: #333;
            font-weight: 600;

         }
         .wrapper .register-link {
            font-size: 14.5px;
            text-align: center;
            margin: 20px 0 15px;
        
         }
          .register-link p a {
            color: white ;
            text-decoration: none;
            font-weight: 600;
         }
         .register-link p a:hover {
            text-decoration: underline;
         }


    
    </Style>
</head>
<body>
    <div class="wrapper"></div>
        <form action="">
            <h1>login</h1>
            <div class="input-box">
                <input type="text" placeholder="Username" required>
                <i class="input-box"></i>
            </div>
            <div class="input-box">
                <input type="password"placeholder="password" required>
                <i class="bx bxs-lock-alt"></i>
            </div>
            <div class="remembe-forgot">
                <label><input type="checkbox"> remember me</label>
                <a href="#">Forgot password</a>
            </div>
            <button type="submit" class="btn">Login</button>

            <div class="register-link">
                <p>Don't have an account? <a href="#">Register</a></p>
            </div>
        </form>
</body>
</html>
